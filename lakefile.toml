name = "Quantum"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Quantum"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"

[[lean_lib]]
name = "Quantum"
roots = ["Quantum", "QuantumFrontier"]
globs = ["Quantum.*", "QuantumFrontier"]

[[lean_lib]]
name = "ComparatorChallenges"
roots = [
  "ComparatorChallenges.Challenge",
  "ComparatorChallenges.GslChallenge",
  "ComparatorChallenges.GslSolution",
  "ComparatorChallenges.GslSolutionAxiom",
  "ComparatorChallenges.GslSolutionWeak",
  "ComparatorChallenges.Paper1",
  "ComparatorChallenges.Paper1Claims",
  "ComparatorChallenges.Paper1Solution",
  "ComparatorChallenges.Paper2",
  "ComparatorChallenges.Paper2Claims",
  "ComparatorChallenges.Paper2Solution",
  "ComparatorChallenges.Paper2SolutionWeak",
  "ComparatorChallenges.Paper2SolutionAxiom",
  "ComparatorChallenges.Paper2Headline",
  "ComparatorChallenges.Solution",
  "ComparatorChallenges.SolutionLoewner",
]

# Route-independence audit (assert_not_imported); not a default target.
# Build with `lake --wfail build RouteAudit`.
[[lean_lib]]
name = "RouteAudit"
roots = ["RouteAudit.Default"]
