fidelity:
  divergences: >-
    Declaration docstrings record source-specific qualifications, including
    arbitrary bases, fixed algebra domains, total functional calculus,
    real parts of traces, and conventions for nonnegative inputs.
    Chapter-level references do not assert numbered theorem correspondences.
    The two-sided alpha-one limit to normalized Umegaki relative entropy covers
    nonzero PSD inputs with support inclusion; the two positive-definite roots
    are kept. The five theorems on the unrestricted predicates do not assert
    standard operator convexity or concavity.
    Finite Jensen is available on open intervals containing zero without an
    explicit continuity assumption, and on general order-connected intervals
    containing zero with continuity within the interval assumed at included
    endpoints; interior continuity is derived from uniform operator convexity.

review:
  status: "self-assessed"
  reviewers: []
  notes: "Self-assessed by the formalization authors: statements were compared against the accompanying paper, and the 34 theorems were replayed through Lean's kernel and the independent nanoda kernel via Comparator."
