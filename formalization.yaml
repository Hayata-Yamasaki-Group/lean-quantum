automation:
  methods:
    - method: "agent"
      models: ["Anthropic Claude (Opus 4 series through Fable 5.x)", "OpenAI GPT (GPT-5 series through GPT-6)"]
      framework: "Claude Code (Anthropic) and Codex CLI (OpenAI)"
      tool_setup: >-
        Human-designed decomposition of the mathematical proofs into small statements
        with stable interfaces and theorem skeletons exposing the intended dependency
        graph; AI assistance was used for local proof search, lemma discovery, and
        code fragments compatible with the fixed interfaces. Statement design remained
        human-guided.
      prompting_notes: >-
        Statement-first workflow: statements and interfaces were fixed before proof
        search; each task was a fixed-interface proof or lemma request checked by
        lake build.
  spend_usd: >-
    Mostly subscription-based usage (Claude Code and Codex CLI plans); some
    contributors also used pay-as-you-go API access, whose spend was not tracked
    separately.
  notes: >-
    Human authors set scope, decomposed proofs, froze statements, and reviewed all
    public prose. Models were updated during the project as new releases became
    available (roughly GPT-5 to GPT-6 on the OpenAI side and Claude Opus 4 to
    Claude Fable 5.x on the Anthropic side); no single model version produced the
    whole development. The final statement/solution pairs were replayed through
    Lean's kernel and the independent nanoda kernel via Comparator.

