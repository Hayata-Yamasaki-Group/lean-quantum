version: "v0.4"

project:
  name: "Lean-Quantum: Paper 1"
  description: >-
    Lean 4 formalization accompanying Lean-Quantum: Toward AI-Assisted
    Formalization of Quantum Information. Of the 34 theorems checked with
    Comparator, 29 formalize some of the theorems stated in Sections 1.5 and
    2--4 of the paper (one theorem of the paper is sometimes split into several
    Lean theorems), and five justify the choice of definitions of operator
    convexity and concavity.
    The scope covers complete positivity and its representations, operator
    powers, Jensen inequalities, generalized perspectives, Lieb--Ando trace
    inequalities, and sandwiched Renyi data processing.
  authors:
    - "Kazumi Kasaura"
    - "Kei Tsukamoto"
    - "Kento Mori"
    - "Lisa Mizuno"
    - "Takahiro Namatame"
    - "Yuta Oriike"
    - "Masaya Taniguchi"
    - "Sho Sonoda"
    - "Hayata Yamasaki"
  responsible_maintainers: [] # Maintainers are not listed.
  license: "Apache-2.0"

